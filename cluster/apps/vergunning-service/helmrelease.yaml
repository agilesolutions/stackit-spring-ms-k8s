apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vergunning-service
  namespace: services
spec:
  interval: 1m
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./helm/vergunning-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image:
      repository: agilesolutions/vergunning-service
      tag: 1.0.0 # {"$imagepolicy": "flux-system:vergunning-service-policy:tag"}
    service:
      port: 8080
    ingress:
      enabled: true
      className: traefik
      host: vergunning.local
