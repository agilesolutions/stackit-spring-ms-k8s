apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.18.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    controller:
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    crds:
      enabled: true
    replicaCount: 1
    prometheus:
      enabled: false
    startupapicheck:
      enabled: true
    webhook:
      replicaCount: 0
    cainjector:
      replicaCount: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi