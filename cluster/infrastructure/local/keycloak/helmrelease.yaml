apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 30m

  chart:
    spec:
      chart: keycloakx
      version: "7.2.x"
      sourceRef:
        kind: HelmRepository
        name: codecentric
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      strategy: rollback

  values:

    replicas: 2

    image:
      repository: quay.io/keycloak/keycloak

    command:
      - "/opt/keycloak/bin/kc.sh"

    args:
      - start

    service:
      type: ClusterIP

    ingress:
      enabled: true

      className: traefik

      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod

      hosts:
        - host: keycloak.example.com
          paths:
            - path: /
              pathType: Prefix

      tls:
        - secretName: keycloak-tls
          hosts:
            - keycloak.example.com

    database:
      vendor: postgres

    externalDatabase:
      enabled: true

      host: postgres-rw.database.svc.cluster.local
      port: 5432
      database: keycloak

      existingSecret: keycloak-db-secret
      existingSecretUserKey: username
      existingSecretPasswordKey: password

    extraEnv: []

    resources:
      requests:
        cpu: 500m
        memory: 1Gi

      limits:
        cpu: "2"
        memory: 2Gi

    podDisruptionBudget:
      enabled: true
      minAvailable: 1