apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/part-of: platform
spec:
  interval: 15m
  releaseName: keda
  chart:
    spec:
      chart: keda
      version: "v2.19.0"
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    crds:
      install: true
    resources:
      operator:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi