apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  values:
    provider:
      name: webhook
    domainFilters:
      - overheid.example.nl
    policy: sync
    registry: txt
    txtOwnerId:
      ske-cluster-overheid
    txtPrefix:
      external-dns-
    sources:
      - ingress
      - service
    logLevel:
      info
    extraArgs:
      - --annotation-filter=external-dns.alpha.kubernetes.io/hostname
    env:
      - name: STACKIT_SERVICE_ACCOUNT_KEY
        valueFrom:
          secretKeyRef:
            name: external-dns-stackit
            key: STACKIT_SERVICE_ACCOUNT_KEY