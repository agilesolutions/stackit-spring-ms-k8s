apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zakenregistratie-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "zakenregistratie-service.fullname" . }}
    app.kubernetes.io/component: "backend"

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: zakenregistratie-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zakenregistratie-service.fullname" . }}
        app.kubernetes.io/component: "backend"
    spec:
      serviceAccountName: {{ include "zakenregistratie-service.fullname" . }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "zakenregistratie-service.fullname" . }}
              app.kubernetes.io/component: "backend"
      containers:
        - name: {{ include "zakenregistratie-service.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "zakenregistratie-service.fullname" . }}
            - secretRef:
                name: {{ include "zakenregistratie-service.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080