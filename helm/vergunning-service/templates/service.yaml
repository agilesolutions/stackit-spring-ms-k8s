apiVersion: v1
kind: Service
metadata:
  name: {{ include "vergunning-service.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "vergunning-service.fullname" . }}
    app.kubernetes.io/component: "frontend"
  ports:
    - port: 8080
      targetPort: 8080
  type: {{ .Values.service.type }}