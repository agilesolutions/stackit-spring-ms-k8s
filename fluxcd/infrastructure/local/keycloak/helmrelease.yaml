apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
spec:
  interval: 15m
  releaseName: keycloak
  chart:
    spec:
      chart: keycloak
      version: "24.3.1"
      sourceRef:
        kind: HelmRepository
        name: keycloak
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    production: true
    replicaCount: 2
    proxyHeaders: xforwarded
    auth:
      existingSecret: keycloak-admin
    externalDatabase:
      host: postgres
      port: 5432
      database: keycloak
      user: keycloak
      existingSecret: keycloak-database
      existingSecretPasswordKey: password
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: keycloak.example.com
      tls: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    metrics:
      enabled: true
    readinessProbe:
      enabled: true
    livenessProbe:
      enabled: true