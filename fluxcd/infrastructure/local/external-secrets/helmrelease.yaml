apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: platform
spec:
  interval: 15m

  releaseName: external-secrets

  chart:
    spec:
      chart: external-secrets
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      strategy: rollback

  values:
    installCRDs: true

    replicaCount: 2

    webhook:
      replicaCount: 2

    certController:
      replicaCount: 2

    resources:
      requests:
        cpu: 100m
        memory: 128Mi

      limits:
        cpu: 500m
        memory: 512Mi

    webhook:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi

        limits:
          cpu: 500m
          memory: 512Mi

    certController:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi

        limits:
          cpu: 500m
          memory: 512Mi